name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # Add macos-latest once the Darwin port builds end-to-end.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets --locked

      - name: test
        run: cargo test --workspace --locked

      - name: conformance
        if: runner.os == 'Linux'
        run: make conformance

  # The Windows guest port runs PE guests: the runtime library and the chimera
  # CLI build, and the runtime's unit tests (the guest run loop — execution,
  # syscall interception, FP, segment virtualization, self-modifying code — and
  # the PE loader) run on the Windows runner. The examples' Linux VFS surface and
  # the conformance suite remain Linux-only. Not yet parity: system-DLL imports,
  # threads, exception delivery, and NT-syscall passthrough.
  windows:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: build
        run: cargo build -p chimera-runtime -p chimera-cli --locked

      - name: test
        run: cargo test -p chimera-runtime --lib --locked
